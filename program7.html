<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>task manager</title></head>
<body><h2>task list</h2>
     <input id = "task" placeholder="enter a task">
     <button onclick="add()">add</button>
     <ul id="list"></ul>
     <script>function add(){
                 let input = document.getElementById("task");
                 if (!input.value) return;
                 let li = document.createElement("li");
                 li.innerHTML = `${input.value}
                 <button onclick="edit(this)"> edit </button> 
                 <button onclick="this.parentElement.remove()"> delete </button>`;
                 document.getElementById("list").append(li);
                 input.value="";}
             function edit(btn){let li = btn.parentElement;
                           let text = prompt("edit task:",li.firstChild.textContent.trim());
                           if (text) li.firstChild.textContent = text + ""
                           li.style.color = "green";}
                           </script>
                           </body>
                           </html>
