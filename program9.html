
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        #root {
            max-width: 400px;
            margin: 30px auto;
            padding: 10px;
        }

        .student {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ddd;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
        }

        .present {
            color: green;
        }

        .absent {
            color: red;
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        function Student({ name, regNo }) {
            const [present, setPresent] = React.useState(false);

            return (
                <div className="student">
                    <h3>{name}</h3>
                    <p>Register No: {regNo}</p>

                    <p>
                        Attendance:{" "}
                        <span className={present ? "present" : "absent"}>
                            {present ? "Present" : "Absent"}
                        </span>
                    </p>

                    <button onClick={() => setPresent(!present)}>
                        {present ? "Mark Absent" : "Mark Present"}
                    </button>
                </div>
            );
        }

        function App() {
            const students = [
                { name: "Rahul", regNo: "101" },
                { name: "Priya", regNo: "102" },
                { name: "Amit", regNo: "103" }
            ];

            return (
                <div>
                    <h2>Student Attendance System</h2>

                    {students.map((student) => (
                        <Student
                            key={student.regNo}
                            name={student.name}
                            regNo={student.regNo}
                        />
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);
    </script>
</body>
</html>
